name: Build ALVIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ALVIS run_alvis.py

      - name: Bundle Microsoft VC runtime
        shell: pwsh
        run: |
          $runtimeFiles = @(
            "$env:WINDIR\System32\vcruntime140.dll",
            "$env:WINDIR\System32\vcruntime140_1.dll",
            "$env:WINDIR\System32\msvcp140.dll"
          )
          foreach ($file in $runtimeFiles) {
            if (Test-Path $file) { Copy-Item $file "dist\ALVIS\_internal\" -Force }
          }

      - name: Verify portable bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ALVIS\ALVIS.exe")) { throw "ALVIS.exe was not created" }
          if (-not (Test-Path "dist\ALVIS\_internal\python312.dll")) { throw "python312.dll is missing" }
          if (-not (Test-Path "dist\ALVIS\_internal\vcruntime140.dll")) { throw "vcruntime140.dll is missing" }

      - name: Package
        shell: pwsh
        run: |
          if (Test-Path "ALVIS-Windows.zip") { Remove-Item "ALVIS-Windows.zip" -Force }
          Compress-Archive -Path "dist\ALVIS\*" -DestinationPath "ALVIS-Windows.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: ALVIS-Windows
          path: ALVIS-Windows.zip
          if-no-files-found: error
