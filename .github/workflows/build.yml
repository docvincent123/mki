name: Build ALVIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --name ALVIS alvis/__main__.py
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/ALVIS/* -DestinationPath ALVIS-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ALVIS-Windows
          path: ALVIS-Windows.zip
